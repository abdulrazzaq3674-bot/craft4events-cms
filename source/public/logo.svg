    </text>
    <!-- "GLOBAL EVENT ARCHITECTURE" -->
    <text x="2" y="36" font-family="'Montserrat', system-ui, -apple-system, sans-serif" font-size="7.5" font-weight="500" letter-spacing="0.36em" fill="#E7E5E4" opacity="0.85">
