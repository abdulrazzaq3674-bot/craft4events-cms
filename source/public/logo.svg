    <path d="M24 0L48 24L24 48L0 24Z" stroke="#C5A880" stroke-width="1.2" fill="none" opacity="0.9"/>
    <path d="M24 5L43 24L24 43L5 24Z" stroke="#FFFFFF" stroke-width="0.8" fill="none" opacity="0.45"/>
    <!-- Stylized Roman Numeral IV & Architectural Monogram -->
