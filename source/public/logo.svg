    <path d="M17 28H29" stroke="#C5A880" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M27 17V34" stroke="#FFFFFF" stroke-width="1.5" stroke-linecap="round"/>
    <circle cx="24" cy="24" r="1.5" fill="#C5A880"/>
  </g>
  
